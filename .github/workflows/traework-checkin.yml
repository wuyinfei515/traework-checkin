name: Traework Daily Checkin

on:
  schedule:
    - cron: '25 16 * * *'   # 每天 UTC 16:25 = 北京时间次日 00:25
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        run: |
          python_cmd=$(command -v python3 || command -v python)
          echo "PYTHON=$python_cmd" >> "$GITHUB_ENV"
          $python_cmd --version

      - name: Write session file
        env:
          TRAE_COOKIE: ${{ secrets.TRAE_COOKIE }}
        run: |
          $PYTHON -c "
          import os, json, sys
          raw = os.environ.get('TRAE_COOKIE', '').replace('\r', '')
          with open('sess.json', 'w', encoding='utf-8') as f:
              f.write(raw)
          d = json.loads(raw)
          print(f'sess.json OK: {len(d.get(\"cookies\", []))} cookies, device_id={d.get(\"device_id\", \"?\")}')
          "

      - name: Run Traework checkin
        id: checkin
        run: |
          cd scripts
          $PYTHON trae_checkin.py --session ../sess.json
          EC=$?
          echo "exit_code=$EC"
          cat checkin.log 2>/dev/null || true
          exit $EC

      - name: Send result to Feishu
        if: always()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          if [ -n "$FEISHU_WEBHOOK_URL" ]; then
            $PYTHON scripts/feishu_notify.py
          else
            echo "FEISHU_WEBHOOK_URL not configured, skipping notification"
          fi
