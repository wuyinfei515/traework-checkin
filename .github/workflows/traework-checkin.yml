name: Traework Daily Checkin

on:
  schedule:
    - cron: '25 16 * * *'   # 每天 UTC 16:25 = 北京时间次日 00:25
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        run: |
          python_cmd=$(command -v python3 || command -v python)
          echo "PYTHON=$python_cmd" >> "$GITHUB_ENV"
          $python_cmd --version

      - name: Run Traework checkin
        id: checkin
        env:
          TRAE_COOKIE: ${{ secrets.TRAE_COOKIE }}
        run: |
          set +e
          $PYTHON -c "
          import os, sys, json
          raw = os.environ.get('TRAE_COOKIE', '')
          print(f'[DEBUG] TRAE_COOKIE length={len(raw)}, first_bytes={raw[:20]!r}')
          with open('sess.json', 'w', encoding='utf-8') as f:
              f.write(raw)
          print(f'[DEBUG] sess.json written, {len(raw)} bytes')
          try:
              d = json.loads(raw)
              print(f'[DEBUG] JSON OK: {len(d.get(\"cookies\",[]))} cookies')
          except Exception as e:
              print(f'[DEBUG] JSON PARSE FAIL: {e}')
              sys.exit(99)
          "
          cd scripts
          $PYTHON trae_checkin.py --session ../sess.json
          EC=$?
          echo "exit_code=$EC"
          echo "=== checkin.log ==="
          cat checkin.log 2>/dev/null || echo "(no log file)"
          exit $EC
        continue-on-error: true

      - name: Send result to Feishu
        if: always()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          if [ -n "$FEISHU_WEBHOOK_URL" ]; then
            $PYTHON scripts/feishu_notify.py
          else
            echo "FEISHU_WEBHOOK_URL not configured, skipping notification"
          fi
